# Runs the secrets check, the tests and a Release build.
#
# Manual for now (Actions → CI → Run workflow): the project is built with Xcode 27 / Swift 6.4, and
# GitHub's macOS runners only had Xcode 26.6 in October 2026, whose compiler crashes on this code.
# Once `macos-latest` has Xcode 27, put back the automatic triggers:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
name: CI

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Check for secrets
        run: python3 Tools/check_secrets.py

      - name: Unit tests
        run: swift test --package-path Packages/IPTVKit

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Release build
        run: |
          xcodegen
          xcodebuild -project IPTVStreamer.xcodeproj -scheme IPTVMac -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData.noindex \
            CODE_SIGNING_ALLOWED=NO build

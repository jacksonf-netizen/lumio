# Runs the secrets check, the tests and a Release build on every push and pull request (and by
# hand: Actions → CI → Run workflow).
#
# The project is developed with Xcode 27; GitHub's runners had Xcode 26.6 (October 2026), which
# builds it too. Xcode 26.6's compiler crashes on a function passed straight to `Binding(set:)`,
# so write `set: { update($0) }` rather than `set: update`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Check for secrets
        run: python3 Tools/check_secrets.py

      - name: Unit tests
        run: swift test --package-path Packages/IPTVKit

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Release build
        run: |
          xcodegen
          xcodebuild -project IPTVStreamer.xcodeproj -scheme IPTVMac -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData.noindex \
            CODE_SIGNING_ALLOWED=NO build

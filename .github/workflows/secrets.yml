# Checks every push and pull request for credentials (Tools/check_secrets.py), whatever it touches.
name: Secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets
        run: python3 Tools/check_secrets.py

# Mac: the shared core's tests, the Mac tests and a Release build, on every push and pull request
# that touches the Mac app or the shared code (and by hand: Actions → Mac → Run workflow).
#
# The project is developed with Xcode 27; GitHub's runners had Xcode 26.6 (October 2026), which
# builds it too. Xcode 26.6's compiler crashes on a function passed straight to `Binding(set:)`,
# so write `set: { update($0) }` rather than `set: update`.
name: Mac

on:
  push:
    branches: [main]
    paths:
      - "Shared/**"
      - "Mac/**"
      - "Tools/**"
      - "THIRD-PARTY-NOTICES.md"
      - "version.properties"
      - ".github/workflows/mac.yml"
  pull_request:
    paths:
      - "Shared/**"
      - "Mac/**"
      - "Tools/**"
      - "THIRD-PARTY-NOTICES.md"
      - "version.properties"
      - ".github/workflows/mac.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version

      # MPVKit's prebuilt libraries are large downloads from GitHub releases, which sometimes
      # answer 504. Keep SwiftPM's download cache between runs, and retry resolving a few times.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Shared/LumioCore/Package.resolved', 'Mac/LumioMac/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Resolve packages
        run: |
          for package in Shared/LumioCore Mac/LumioMac; do
            for attempt in 1 2 3 4; do
              swift package resolve --package-path "$package" && break
              [ "$attempt" = 4 ] && exit 1
              echo "Resolving $package failed (attempt $attempt); retrying in $((attempt * 30)) s"
              sleep $((attempt * 30))
            done
          done

      - name: Unit tests (shared core)
        run: swift test --package-path Shared/LumioCore

      - name: Unit tests (Mac)
        run: swift test --package-path Mac/LumioMac

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Release build
        run: |
          xcodegen --spec Mac/project.yml
          xcodebuild -project Mac/Lumio.xcodeproj -scheme IPTVMac -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath Mac/build/DerivedData.noindex \
            CODE_SIGNING_ALLOWED=NO build
